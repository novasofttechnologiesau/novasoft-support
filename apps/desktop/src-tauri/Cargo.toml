[package]
name = "novasoft-support"
version = "0.1.0"
description = "NovaSoft Support Windows desktop app"
edition = "2021"
license = "MIT"

[lib]
name = "novasoft_support_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
chrono = { version = "0.4", features = ["serde"] }
default-net = "0.22"
